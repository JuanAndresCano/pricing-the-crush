[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crush"
version = "0.1.0"
description = "Pricing the Crush: variance swaps, jumps and volatility crush around earnings (Merton vs Bates)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas_market_calendars>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: pruebas de varios minutos (calibración de Bates). Se corren con: pytest -m slow"]
